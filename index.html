<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AFS Damage Matrix">
  <title>Damage Matrix</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kizurex.github.io/afs-damage-calculator/data/gamedata.js"></script>
  <script src="js/champion-database.js"></script>
  <script src="customs.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#attacks" aria-label="Damage Matrix home"><span class="brand-mark">DM</span><span>Damage Matrix</span></a>
    <nav class="main-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="attacks">Attacks</button>
      <button class="nav-item" data-view="matrix">Matrix</button>
      <button class="nav-item" data-view="builds">Builds</button>
      <button class="nav-item" data-view="simulation">Simulation</button>
      <button class="nav-item" data-view="rebalance">Rebalance</button>
      <button class="nav-item" data-view="compare">Compare</button>
      <button class="nav-item" data-view="details">Details</button>
    </nav>
    <div class="top-meta"><label class="top-option">Damage scaling<select id="damage-scaling"><option value="multiplicative">Multiplicative</option><option value="additive">Additive</option></select></label><label class="top-option"><input id="include-dot-effects" type="checkbox" checked> Include DoT effects</label><label class="top-option"><input id="allow-custom-moves" type="checkbox" checked> Allow custom moves</label><span id="data-status">Loading live data</span><button id="theme-toggle" class="icon-button" title="Toggle theme" aria-label="Toggle theme">☾</button></div>
  </header>

  <main id="app" class="app-shell">
    <aside class="catalog-panel">
      <div class="catalog-heading"><div><span class="eyebrow">LIVE INDEX</span><h1>Attacks</h1></div><span id="move-count" class="count">0</span></div>
      <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search attacks, kits, stats" autocomplete="off"></label>
      <label class="utility-toggle"><input id="hide-utility" type="checkbox"> Hide non-damaging</label>
      <div id="catalog" class="catalog" aria-live="polite"></div>
    </aside>
    <section class="workspace">
      <div id="view-attacks" class="view active"></div>
      <div id="view-matrix" class="view"></div>
      <div id="view-builds" class="view"></div>
      <div id="view-simulation" class="view"></div>
      <div id="view-rebalance" class="view"></div>
      <div id="view-compare" class="view empty-view"><span class="eyebrow">STAGE 5</span><h2>Compare</h2><p>Ranked side-by-side comparisons will arrive after rebalancing is finished.</p></div>
      <div id="view-details" class="view"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
